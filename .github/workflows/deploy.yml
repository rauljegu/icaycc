
name: Despliegue ICAyCC a Debian

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    if: github.repository == 'mgrutter/icaycc_web'
    name: Publicar sitio en Debian
    runs-on: ubuntu-latest

    steps:
      - name: Obtener código del repositorio
        uses: actions/checkout@v5

      - name: Desplegar archivos por SSH
        uses: easingthemes/ssh-deploy@v6.0.3
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REMOTE_HOST: ${{ secrets.DEPLOY_HOST }}
          REMOTE_PORT: ${{ secrets.DEPLOY_PORT }}
          REMOTE_USER: ${{ secrets.DEPLOY_USER }}
          TARGET: ${{ secrets.DEPLOY_PATH }}
          SOURCE: ./
          ARGS: "-rlDzvc --delete"
          EXCLUDE: "/.git/, /.github/, /includes/conexion.php, /config/config.php, /admin/includes/connect.php, /.env"